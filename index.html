<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment-with-locales.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.5/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
  </head>

<body>
<div class ="container">
   <h1>World Clock App</h1>

    <select id="city">
        <option value="">Select a city...</option>
        <option value="America/Port-au-Prince">Port-au-Prince</option>
        <option value="America/Los_Angeles">Los Angeles</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Europe/Paris">Paris</option>
    </select>

    <div id="cities">
    <div class="city" id="new-york-city">
        <div>
        <h2>New York City</h2>
        <div class="date"></div>
        </div>
        <div class="time"></div>
    </div>
    <div class="city" id="sydney">
        <div>
        <h2>Sydney</h2>
        <div class="date"></div>
        </div>
        <div class="time"></div>
    </div>
</div>
</div>

<footer> This project was coded by <a href="https://github.com/natachaflemoine" target="_blank">Natacha Fanini-Lemoine</a> 
    and is <a href="https://github.com/natachaflemoine/world-clock" target="_blank"> open-sourced on Github </a> and 
    <a href="https://shecodes-world-clock-app.netlify.app/" target="_blank"> hosted on Netlify</a>
</footer>

<script src="src/index.js"></script>
</body>

</html>
